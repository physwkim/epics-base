# Probe for epics-base/epics-base#1005: which libstdc++ a Strawberry-gcc
# mingw test exe loads when run from a make recipe on the windows-2022
# image, and a symbolized backtrace of the real iocshTest.exe crash.
name: mingw-probe
on:
  workflow_dispatch:
  push:
    branches: [ci/mingw-path-probe]
env:
  SETUP_PATH: .ci-local:.ci
  BASE: SELF
  EPICS_TEST_IMPRECISE_TIMING: YES
  CMP: gcc
  BCFG: default
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Prepare
      run: python .ci/cue.py prepare
    - name: small probe
      run: python probe/probe.py
    - name: Build libCom
      run: python .ci/cue.py build
    - name: iocshTest probe
      run: python probe/probe2.py
